version: '3.8'

services:
  # CLI Interpreter: Runs the interpreter's C++/Make core environment in interactive mode
  mpl-interpreter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mpl-interpreter
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    command: bash -c "make && make run"

  # Web IDE: Spins up the browser-based editor, compiling the code and running development servers
  web-ide:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    container_name: mpl-web-ide
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    command: bash -c "make && cd /app/web/server && npm install && cd /app/web/client && npm install && (npm run dev &) && cd /app/web/server && npm run dev"
    networks:
      - public-reverse-proxy
      - default

  postgres:
    image: postgres:15-alpine
    container_name: mpl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mpl_user
      POSTGRES_PASSWORD: mpl_password
      POSTGRES_DB: mpl_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mpl-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data

networks:
  public-reverse-proxy:
    external: true

volumes:
  pgdata:
  redisdata:
